global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "jenkins"
    metrics_path: "/prometheus/"
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "aws-ec2"
    static_configs:
      - targets: ["16.171.22.14:9100"]
